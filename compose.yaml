#
# The whole platform: `podman compose up` (podman-compose ≥ 1.6, rootless). See infra/README.md.
#
# Rootless rules (enforced by infra/tests/compose.test.ts): no privileged containers, no
# host ports below 1024, no container-engine socket mounts, fully qualified pinned images
# (licenses in infra/image-licenses.json), named volumes, healthchecks everywhere.
# Host ports bind to ${BIND_ADDRESS:-127.0.0.1}; every host port is an env var, so a
# second stack can run alongside (`-p <name>` plus shifted ports).
#
# Profiles: (default) full platform incl. observability · harness: + mock-rtmp ·
# stripe: + stripe-mock · tls: + caddy. The P2P tracker runs by default (viewers opt in to P2P).
#
# Secrets come from .env (`bun scripts/init-env.ts`); nothing secret has a default here.

name: commonair

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 30

# Our own images (built from this repo); the license checker skips templated refs.
x-service-build: &service-build
  context: .
  dockerfile: infra/containers/service.Containerfile

# The shared env file goes only to our own images (the app services and the tools-image jobs),
# which read most of it. Third-party services get exactly the variables they use through
# `environment:` (a test enforces it). The self-hosted units go further and give every unit only
# its own keys (infra/selfhost/env, rendered by scripts/selfhost/render-env.sh); mirroring
# those generated lists here would duplicate them for a development stack with development secrets.
x-env-file: &env-file
  - path: ${COMMONAIR_ENV_FILE:-.env}
    required: false

# Hostnames inside the compose network override the localhost defaults of .env.
x-app-env: &app-env
  DATABASE_URL: postgres://commonair_app:${POSTGRES_APP_PASSWORD:-}@postgres:5432/commonair
  # With VALKEY_PASSWORD set (init-env generates one), redis://:<password>@valkey:6379.
  VALKEY_URL: redis://${VALKEY_PASSWORD:+:${VALKEY_PASSWORD}@}valkey:6379
  S3_ENDPOINT: http://garage:3900
  # Presigned uploads are opened by browsers, not by the services: they need the published
  # Garage port, never the in-network hostname above.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${GARAGE_S3_PORT:-3900}}
  # Public media is read through the origin's /media route, which serves only the public key
  # prefixes; Garage refuses anonymous reads and its web endpoint would expose the private ones
  # (ADR 0009).
  MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:${ORIGIN_PORT:-3003}/media}
  S3_REGION: garage
  S3_FORCE_PATH_STYLE: "true"
  MEDIAMTX_API_URL: http://mediamtx:9997
  MEDIAMTX_HLS_URL: http://mediamtx:8888
  MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
  API_INTERNAL_URL: http://api:3001
  CHAT_INTERNAL_URL: ws://chat:3002/ws
  ORIGIN_INTERNAL_URL: http://origin:3003
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  # In-stack proxies (web, Caddy) forward the client address; trust only them.
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-10.89.42.0/24}
  # Container-side ports are fixed (internal URLs above rely on them); host ports vary.
  WEB_PORT: "3000"
  API_PORT: "3001"
  CHAT_PORT: "3002"
  ORIGIN_PORT: "3003"
  MEDIA_PORT: "3004"
  WORKER_PORT: "3005"
  TRACKER_PORT: "8000"
  IRC_PORT: "6667"
  IRC_TLS_PORT: "6697"
  IRC_WS_PORT: "6680"
  IRC_HEALTH_PORT: "6681"
  # Evidence secrets are blanked for every app service and handed back only where ADR 0006 Q4
  # allows: the evidence bucket key to the worker, the evidence private key to the API.
  S3_EVIDENCE_ACCESS_KEY_ID: ""
  S3_EVIDENCE_SECRET_ACCESS_KEY: ""
  EVIDENCE_PRIVATE_KEY: ""
  # onnxruntime-node's postinstall would fetch proprietary CUDA binaries (ADR 0008).
  ONNXRUNTIME_NODE_INSTALL: skip

x-app-depends: &app-depends
  migrate:
    condition: service_completed_successfully
  garage-init:
    condition: service_completed_successfully
  valkey:
    condition: service_healthy
  otel-collector:
    condition: service_healthy

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "bun", "/opt/commonair/healthcheck.ts"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 30s

services:
  # ---------------------------------------------------------------- data
  postgres:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/postgres:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/postgres/Containerfile
    restart: unless-stopped
    # An init as PID 1 reaps orphans. The postmaster must not be PID 1: it treats any child it
    # did not start (a timed-out healthcheck or `podman exec`, an abandoned archive command) that
    # dies by a signal as a crashed backend and resets every connection (seen as SIGPIPE crashes).
    init: true
    environment:
      POSTGRES_USER: commonair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commonair}
      POSTGRES_DB: commonair
      # WAL-G → Garage (infra/postgres/walg-env.sh maps S3_* to AWS_*). Archiving
      # retries until garage-init has created the key and bucket.
      WALG_S3_PREFIX: s3://${S3_BUCKET_BACKUPS:-commonair-backups}/wal
      WALG_S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      WALG_RETAIN_FULL: ${WALG_RETAIN_FULL:-7}
      # Parallel integration suites each hold several pools; 100 (the Postgres default) runs out.
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-400}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      <<: *healthcheck
      # Healthy = accepts connections and is out of recovery (infra/postgres/health.sh). Compose
      # has no startup check, so the WAL-replay allowance exists only in the Quadlet unit.
      test: ["CMD", "commonair-pg-health"]

  # One-shot: migrations as the owner, then the least-privilege app role.
  migrate:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/tools:${IMAGE_TAG:-dev}
    build:
      <<: *service-build
      args: { SERVICE: tools }
    restart: "no"
    command: ["sh", "-c", "bun packages/db/src/migrate.ts && bun infra/postgres/apply-app-role.ts"]
    env_file: *env-file
    environment:
      DATABASE_URL: postgres://commonair:${POSTGRES_PASSWORD:-commonair}@postgres:5432/commonair
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  valkey:
    image: ghcr.io/valkey-io/valkey:9.1.2-trixie@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    restart: unless-stopped
    # Ephemeral by design (docs/architecture.md): presence, caches, pub/sub, job queues.
    # VALKEY_PASSWORD (from .env; empty runs without one) reaches valkey-server as configuration
    # on its stdin, never on a command line ps shows (the Quadlet unit does the same).
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
    command:
      - sh
      - -c
      - umask 077 && f=$$(mktemp) && { [ -z "$$VALKEY_PASSWORD" ] || printf "requirepass %s\n" "$$VALKEY_PASSWORD"; } >"$$f" && exec <"$$f" && rm -f "$$f" && exec env -u VALKEY_PASSWORD docker-entrypoint.sh valkey-server - --appendonly no --save ""
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${VALKEY_PORT:-6379}:6379"]
    healthcheck:
      <<: *healthcheck
      # Authenticates when there is a password (valkey-cli reads VALKEYCLI_AUTH); NOAUTH fails it.
      test:
        [
          "CMD-SHELL",
          '[ -z "$$VALKEY_PASSWORD" ] || export VALKEYCLI_AUTH="$$VALKEY_PASSWORD"; valkey-cli ping | grep -qx PONG',
        ]

  garage:
    image: docker.io/dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${GARAGE_S3_PORT:-3900}:3900"]
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,Z
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/garage", "status"]

  # One-shot: single-node layout, S3 key import, buckets (idempotent).
  garage-init:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/tools:${IMAGE_TAG:-dev}
    build:
      <<: *service-build
      args: { SERVICE: tools }
    restart: "no"
    command: ["bun", "infra/garage/bootstrap.ts"]
    env_file: *env-file
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_EVIDENCE_ACCESS_KEY_ID: ${S3_EVIDENCE_ACCESS_KEY_ID:-}
      S3_EVIDENCE_SECRET_ACCESS_KEY: ${S3_EVIDENCE_SECRET_ACCESS_KEY:-}
      # Dev only: the browser on PUBLIC_URL uploads to Garage's own port, a cross-origin PUT.
      # Production goes through Caddy on one origin and never sets this (infra/garage/cors.ts).
      GARAGE_CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      disable: true

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  # ---------------------------------------------------------------- media
  mediamtx:
    image: docker.io/bluenviron/mediamtx:1.21.2-ffmpeg@sha256:c0feb4acc548d5f410d57d9046f62dfa355e2abc4098f5243de9e86430c77a95
    restart: unless-stopped
    environment:
      # Expanded by MediaMTX itself in the runOnOnline/runOnOffline hooks of mediamtx.yml.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      API_INTERNAL_URL: http://api:3001
    # RTSP :8554, LL-HLS :8888, API :9997 and metrics :9998 stay inside the network.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MEDIAMTX_RTMP_PORT:-1935}:1935"
      - "${BIND_ADDRESS:-127.0.0.1}:${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      # ICE candidates advertise 8189; keep host and container port equal.
      - "${BIND_ADDRESS:-127.0.0.1}:${MEDIAMTX_ICE_UDP_PORT:-8189}:8189/udp"
    volumes: ["./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro,Z"]
    healthcheck:
      <<: *healthcheck
      # The control API sits behind the auth hook (api may not be up yet): probe RTMP instead.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1935"]

  mock-rtmp:
    profiles: [harness]
    image: docker.io/bluenviron/mediamtx:1.21.2-ffmpeg@sha256:c0feb4acc548d5f410d57d9046f62dfa355e2abc4098f5243de9e86430c77a95
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${MOCK_RTMP_PORT:-1936}:1936"]
    volumes: ["./infra/mediamtx/mock-rtmp-target.yml:/mediamtx.yml:ro,Z"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1936"]

  # ---------------------------------------------------------------- application
  api:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/api:${IMAGE_TAG:-dev}
    build:
      <<: *service-build
      args: { SERVICE: api }
    restart: unless-stopped
    env_file: *env-file
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: api
      EVIDENCE_PRIVATE_KEY: ${EVIDENCE_PRIVATE_KEY:-}
      MODERATION_HASHLIST_CSAM: /var/lib/commonair/moderation/csam.pdq
      MODERATION_HASHLIST_NCII: /var/lib/commonair/moderation/ncii.pdq
      MODERATION_CLASSIFIER_MODEL: /var/lib/commonair/models/model.onnx
    volumes:
      - ${MODERATION_HASHLIST_CSAM:-./infra/moderation/empty-hashlist}:/var/lib/commonair/moderation/csam.pdq:ro,Z
      - ${MODERATION_HASHLIST_NCII:-./infra/moderation/empty-hashlist}:/var/lib/commonair/moderation/ncii.pdq:ro,Z
      - ${MODERATION_CLASSIFIER_MODEL:-./.cache/models/adamcodd-vit-base-nsfw-detector-8587de99-int8.onnx}:/var/lib/commonair/models/model.onnx:ro,Z
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"]
    depends_on: *app-depends
    healthcheck: *app-healthcheck

  chat:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/chat:${IMAGE_TAG:-dev}
    build:
      <<: *service-build
      args: { SERVICE: chat }
    restart: unless-stopped
    env_file: *env-file
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: chat
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${CHAT_PORT:-3002}:3002"]
    depends_on: *app-depends
    healthcheck: *app-healthcheck

  irc:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/irc:${IMAGE_TAG:-dev}
    build:
      <<: *service-build
      args: { SERVICE: irc }
    restart: unless-stopped
    env_file: *env-file
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: irc
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${IRC_PORT:-6667}:6667"
      - "${BIND_ADDRESS:-127.0.0.1}:${IRC_TLS_PORT:-6697}:6697"
      - "${BIND_ADDRESS:-127.0.0.1}:${IRC_WS_PORT:-6680}:6680"
      # Health endpoint, so the harness can check the gateway from the host.
      - "${BIND_ADDRESS:-127.0.0.1}:${IRC_HEALTH_PORT:-6681}:6681"
    depends_on:
      <<: *app-depends
      chat:
        condition: service_healthy
    healthcheck: *app-healthcheck

  origin:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/origin:${IMAGE_TAG:-dev}
    build:
      <<: *service-build
      args: { SERVICE: origin }
    restart: unless-stopped
    env_file: *env-file
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: origin
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${ORIGIN_PORT:-3003}:3003"]
    depends_on:
      <<: *app-depends
      mediamtx:
        condition: service_healthy
    healthcheck: *app-healthcheck

  media:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/media:${IMAGE_TAG:-dev}
    build:
      <<: *service-build
      args: { SERVICE: media }
    restart: unless-stopped
    env_file: *env-file
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: media
      # Scratch space for VOD segments, clips and the live clip buffer.
      MEDIA_WORK_DIR: /var/lib/commonair/media
      MODERATION_HASHLIST_CSAM: /var/lib/commonair/moderation/csam.pdq
      MODERATION_HASHLIST_NCII: /var/lib/commonair/moderation/ncii.pdq
    volumes:
      - media-work:/var/lib/commonair/media
      - ${MODERATION_HASHLIST_CSAM:-./infra/moderation/empty-hashlist}:/var/lib/commonair/moderation/csam.pdq:ro,Z
      - ${MODERATION_HASHLIST_NCII:-./infra/moderation/empty-hashlist}:/var/lib/commonair/moderation/ncii.pdq:ro,Z
    depends_on:
      <<: *app-depends
      mediamtx:
        condition: service_healthy
    healthcheck: *app-healthcheck
    # GPU (NVENC) is opt-in: see infra/README.md (CDI device `nvidia.com/gpu=all`).

  worker:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/worker:${IMAGE_TAG:-dev}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${WORKER_PORT:-3005}:3005"]
    build:
      <<: *service-build
      args: { SERVICE: worker }
    restart: unless-stopped
    env_file: *env-file
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: worker
      S3_EVIDENCE_ACCESS_KEY_ID: ${S3_EVIDENCE_ACCESS_KEY_ID:-}
      S3_EVIDENCE_SECRET_ACCESS_KEY: ${S3_EVIDENCE_SECRET_ACCESS_KEY:-}
      MODERATION_HASHLIST_CSAM: /var/lib/commonair/moderation/csam.pdq
      MODERATION_HASHLIST_NCII: /var/lib/commonair/moderation/ncii.pdq
      MODERATION_CLASSIFIER_MODEL: /var/lib/commonair/models/model.onnx
    volumes:
      - ${MODERATION_HASHLIST_CSAM:-./infra/moderation/empty-hashlist}:/var/lib/commonair/moderation/csam.pdq:ro,Z
      - ${MODERATION_HASHLIST_NCII:-./infra/moderation/empty-hashlist}:/var/lib/commonair/moderation/ncii.pdq:ro,Z
      - ${MODERATION_CLASSIFIER_MODEL:-./.cache/models/adamcodd-vit-base-nsfw-detector-8587de99-int8.onnx}:/var/lib/commonair/models/model.onnx:ro,Z
    depends_on: *app-depends
    healthcheck: *app-healthcheck

  # WebTorrent tracker (ADR 0005). Always on: P2P_ENABLED offers P2P, and players that opt in
  # get tracker URLs.
  tracker:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/tracker:${IMAGE_TAG:-dev}
    build:
      <<: *service-build
      args: { SERVICE: tracker }
    restart: unless-stopped
    env_file: *env-file
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: tracker
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${TRACKER_PORT:-8000}:8000"]
    depends_on: *app-depends
    healthcheck: *app-healthcheck

  web:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/web:${IMAGE_TAG:-dev}
    build:
      <<: *service-build
      args: { SERVICE: web }
    restart: unless-stopped
    env_file: *env-file
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: web
      HEALTHCHECK_PATH: /healthz
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *app-healthcheck

  # ---------------------------------------------------------------- observability (default-on)
  otel-collector:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/otel-collector:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/containers/probe.Containerfile
      args:
        {
          BASE_IMAGE: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.163.1@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806",
        }
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # Host services in local development export to localhost:4318 (.env.example default).
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"]
    volumes: ["./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro,Z"]
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]

  prometheus:
    image: quay.io/prometheus/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]

  loki:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/loki:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/containers/probe.Containerfile
      args:
        {
          BASE_IMAGE: "docker.io/grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193",
        }
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/config.yaml:ro,Z
      - loki-data:/loki
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]

  tempo:
    image: ${IMAGE_REGISTRY:-localhost/commonair}/tempo:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/containers/probe.Containerfile
      args:
        {
          BASE_IMAGE: "docker.io/grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd",
        }
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro,Z
      - tempo-data:/var/tempo
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]

  grafana:
    image: docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    # Refuse to start with Grafana's built-in admin/admin.
    entrypoint:
      - /bin/sh
      - -c
      - 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "GRAFANA_ADMIN_PASSWORD is required" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3030}:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]

  # ---------------------------------------------------------------- optional profiles
  caddy:
    profiles: [tls]
    image: docker.io/library/caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      TLS_MODE: ${TLS_MODE:-acme}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_CA: ${ACME_CA:-}
      # Caddy forwards presigned uploads into the media bucket's incoming/ prefix and presigned
      # export downloads to Garage (ADR 0024). Browsers reach them only when the services sign
      # for this host: set S3_PUBLIC_ENDPOINT=https://<PUBLIC_HOSTNAME> in .env as well.
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-commonair-media}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-commonair-exports}
    # Public by design; see infra/README.md for reaching 80/443 rootless.
    ports:
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-8443}:443"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      # api already waits for Garage and its buckets (garage-init), so Garage needs no entry.
      api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]

  stripe-mock:
    profiles: [stripe]
    image: docker.io/stripe/stripe-mock:v0.206.0@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${STRIPE_MOCK_PORT:-12111}:12111"]
    healthcheck:
      <<: *healthcheck
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "--header",
          "Authorization: Bearer sk_test_123",
          "http://127.0.0.1:12111/v1/customers",
        ]

# A fixed subnet so services can trust forwarded client addresses from in-stack proxies
# (web's /api proxy, Caddy) without trusting the world. Override with COMPOSE_SUBNET.
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-10.89.42.0/24}

volumes:
  postgres-data:
  media-work:
  garage-meta:
  garage-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  caddy-data:
  caddy-config:
