version = 1

# Files that cannot carry an inline header (JSON, lockfiles, generated output,
# binary assets). Everything else carries its own SPDX header.
[[annotations]]
path = [
  "**/package.json",
  "**/tsconfig*.json",
  "bun.lock",
  "patches/*.patch",
  "**/*.json",
  "**/drizzle/**",
  "**/routeTree.gen.ts",
  "relay/go.mod",
  "relay/go.sum",
  ".github/ISSUE_TEMPLATE/config.yml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 CommonAir contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The SDK is Apache-2.0 (ADR 0035), including its JSON files, which carry no header; files with
# their own header keep it ("closest"), so an inlined AGPL file is never relabelled silently.
[[annotations]]
path = ["packages/sdk/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 CommonAir contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["**/*.png", "**/*.svg", "**/*.ico", "**/*.webp", "**/*.jpg", "harness/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 CommonAir contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Tool-generated cache directory tags (reuse scans them even inside ignored dirs).
[[annotations]]
path = ["**/CACHEDIR.TAG"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 CommonAir contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["packages/moderation/tests/vectors/**"]
precedence = "override"
SPDX-FileCopyrightText = "Meta Platforms, Inc. and affiliates"
SPDX-License-Identifier = "BSD-3-Clause"

# Written by `tofu providers lock`, which rewrites the whole file and drops comments.
[[annotations]]
path = ["infra/tofu/**/.terraform.lock.hcl"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 CommonAir contributors"
SPDX-License-Identifier = "CC0-1.0"
