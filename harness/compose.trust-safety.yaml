#
# Compose override for the `trust-safety` harness scenario ONLY. Never use it on a public
# instance: it turns on the moderation test hooks (the scripted classifier and the
# /internal/moderation/* routes) and loads the synthetic fixture hash lists.
#
#   podman compose -f compose.yaml -f harness/compose.trust-safety.yaml up -d
#
# Paths are relative to the project directory (the first file's directory, the repo root).
# The lists hold only the PDQ hashes of synthetic geometric test patterns generated by code in
# packages/moderation/fixtures/ (no industry hash list is downloaded or embedded).

x-trust-safety-env: &trust-safety-env
  MODERATION_HASHLIST_CSAM: /fixtures/moderation/csam.pdq
  MODERATION_HASHLIST_NCII: /fixtures/moderation/ncii.pdq
  MODERATION_CLASSIFIER: "scripted"
  MODERATION_SAMPLE_SECONDS: "2"
  MODERATION_TEST_HOOKS: "true"

x-fixtures-volume: &fixtures-volume ./packages/moderation/fixtures:/fixtures/moderation:ro,Z

services:
  media:
    environment: *trust-safety-env
    volumes: [*fixtures-volume]
  worker:
    environment: *trust-safety-env
    volumes: [*fixtures-volume]
  api:
    environment: *trust-safety-env
    volumes: [*fixtures-volume]
