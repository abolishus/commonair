#
# Compose override for the N4 `federation` harness scenario ONLY (ADR 0030). Never use it on a
# public instance: it turns federation on instance-wide (batch 7 decision (c) ships it off) and
# lets the worker deliver to, and fetch keys from, the in-harness ActivityPub peer
# (harness/src/mocks/activitypub/) on a private address through host.containers.internal
# (OUTBOUND_ALLOW_PRIVATE_NETWORKS). Each channel stays off until its streamer turns it on.
#
# Layered only for the `w3` and `interact` shards and their scenarios, with
# harness/compose.w3.yaml and harness/compose.n3.yaml (scripts/infra.ts `W3_OVERRIDES`):
#
#   bun scripts/infra.ts stack --harness --w3
#
# The `multi` replicas get the same values (they share the queues, so a job may run on either);
# harness/tests/w3/overlays.test.ts keeps them identical. The peer needs nothing else: the worker
# reaches it at http://<HARNESS_WEBHOOK_HOST>:<port> (resolveCallback allows http and private
# addresses only with OUTBOUND_ALLOW_PRIVATE_NETWORKS), and the peer reaches the API on its own port.

x-n4-env: &n4-env
  FEDERATION_ENABLED: "true"
  OUTBOUND_ALLOW_PRIVATE_NETWORKS: "true"

services:
  api:
    environment: *n4-env
  worker:
    environment: *n4-env
  api-2:
    environment: *n4-env
  worker-2:
    environment: *n4-env
