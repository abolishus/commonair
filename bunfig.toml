#
# Supply-chain defaults (ADR 0022); scripts/check-supply-chain.ts enforces them.

[install]
# `bun add` saves an exact version, never a ^range.
exact = true
# Refuse versions published less than 7 days ago (seconds). Most malicious releases are caught
# and pulled within days; the cooldown keeps them out of the resolution window entirely.
minimumReleaseAge = 604800
