#
# GitHub Pages for main: the UI Storybook at the root, and README badge data under /badges (a
# shields.io endpoint file, so coverage needs no third-party service). A deploy replaces the
# whole site, which is why both are built in one job.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: storybook-pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: "1.4.3"
  GO_VERSION: "1.27.3"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ffmpeg: the harness unit tests probe and run the installed one.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          bun-version: ${{ env.BUN_VERSION }}
          go-version: ${{ env.GO_VERSION }}
          ffmpeg: "true"
      - name: Build Storybook
        run: bun run --filter @commonair/ui build-storybook
      - name: Unit coverage
        # A red run still deploys Storybook; the badge then reads "tests failing". The gate is ci.yml.
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bun scripts/coverage.ts --out packages/ui/storybook-static/badges/coverage.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/ui/storybook-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
