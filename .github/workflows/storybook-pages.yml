#
# GitHub Pages for main: the UI Storybook at the root, and README badge data under /badges (a
# shields.io endpoint file, so coverage needs no third-party service). A deploy replaces the
# whole site, which is why both are built in one job.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: storybook-pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: "1.4.3"
  GO_VERSION: "1.27.3"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # ffmpeg: the harness unit tests probe and run the installed one.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          bun-version: ${{ env.BUN_VERSION }}
          go-version: ${{ env.GO_VERSION }}
          ffmpeg: "true"
      - name: Build Storybook
        run: bun run --filter @commonair/ui build-storybook
      - name: Unit coverage
        # A red run still deploys Storybook; the badge then reads "tests failing". The gate is ci.yml.
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bun scripts/coverage.ts --out packages/ui/storybook-static/badges/coverage.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: packages/ui/storybook-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
