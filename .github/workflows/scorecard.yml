#
# OpenSSF Scorecard: scores the repository's security practices (pinned dependencies, branch
# protection, signed releases, known vulnerabilities, workflow hygiene) and publishes the result
# for the README badge. Publishing imposes rules on this file: no top-level env or defaults, and
# only the scorecard, checkout, upload-artifact and upload-sarif actions in the job.
name: scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      # Upload the results to the Security tab, and sign them for the public API.
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          fail_on_publish_error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
