#
# Backstop CI: runs the same `bun run verify` used locally. If it goes red on
# main, fix main immediately.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.3"
      - name: Tooling (reuse, podman-compose, ffmpeg)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pipx install reuse==6.2.0
          pipx install podman-compose==1.6.0
          podman --version
          # Playwright needs WebKit/Chromium system libraries for the harness scenarios.
          bunx playwright@1.64.1 install-deps chromium webkit
      - run: bun install --frozen-lockfile
      - name: Environment
        run: bun scripts/init-env.ts
      - name: Verify
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.ref }}" = "refs/heads/main" ] && [ -f harness/src/cli.ts ]; then
            bun run verify:full
          else
            bun run verify
          fi
