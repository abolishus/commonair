#
# Backstop CI: runs the same `bun run verify` used locally. If it goes red on
# main, fix main immediately.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook_build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Build Storybook
        run: bun run --filter @commonair/ui build-storybook
      - uses: actions/upload-pages-artifact@v4
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        with:
          path: packages/ui/storybook-static

  storybook_deploy:
    needs: storybook_build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Storybook to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: [storybook_build, storybook_deploy]
    if: ${{ !cancelled() && needs.storybook_build.result == 'success' && (needs.storybook_deploy.result == 'success' || needs.storybook_deploy.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - name: Tooling (reuse, podman-compose, ffmpeg)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pipx install reuse==6.2.0
          pipx install podman-compose==1.6.0
          podman --version
          # Playwright needs WebKit/Chromium system libraries for the harness scenarios.
          bunx playwright@1.64.1 install-deps chromium webkit
      - run: bun install --frozen-lockfile
      - name: Environment
        run: bun scripts/init-env.ts
      - name: Verify
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.ref }}" = "refs/heads/main" ] && [ -f harness/src/cli.ts ]; then
            bun run verify:full
          else
            bun run verify
          fi
