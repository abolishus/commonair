#
# Backstop CI: runs the same `bun run verify` used locally, one job per group of its steps. If it
# goes red on main, fix main immediately. Pull requests run the gate; main, the nightly schedule
# and a manual dispatch also run the full harness scenario, a release dry run (release.yml) and
# the self-host end-to-end test. `ci-ok` is the one check branch protection requires.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: "1.4.3"
  GO_VERSION: "1.27.3"

jobs:
  lint-workflows:
    name: lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Tools
        run: |
          bun scripts/release/tools.ts install --dir "$RUNNER_TEMP/bin" actionlint zizmor shellcheck
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: actionlint
        # Also shellchecks every `run:` script, with the shellcheck installed above.
        run: actionlint -color
      - name: zizmor
        env:
          # Online audits: impostor commits, known-vulnerable actions, ref confusion.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .github
      - name: shellcheck (self-host and Postgres image scripts)
        run: |
          mapfile -t files < <(git ls-files 'scripts/selfhost.sh' 'scripts/selfhost/*.sh' 'infra/postgres/*.sh' 'infra/tofu/*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no self-host shell scripts yet"
          else
            shellcheck --version
            shellcheck "${files[@]}"
          fi

  verify:
    # One job per group of the gate (`bun run verify --only <group>`), in parallel: a pull request
    # waits for the slowest group, not the sum, and a red group no longer hides the others.
    name: verify (${{ matrix.group }})
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              group: static,
              timeout: 20,
              step-timeout: 15,
              pipx: "reuse==6.2.0",
              ffmpeg: "false",
              playwright-deps: "false",
              browsers: "false",
              model: "false",
            }
          # ffmpeg: the harness unit tests probe and run the installed one.
          - {
              group: unit,
              timeout: 25,
              step-timeout: 20,
              pipx: "",
              ffmpeg: "true",
              playwright-deps: "false",
              browsers: "false",
              model: "false",
            }
          # The harness integration tests drive Chromium and WebKit; the classifier's runs the model.
          - {
              group: integration,
              timeout: 60,
              step-timeout: 55,
              pipx: "podman-compose==1.6.0",
              ffmpeg: "true",
              playwright-deps: "true",
              browsers: "true",
              model: "true",
            }
          - {
              group: relay,
              timeout: 15,
              step-timeout: 10,
              pipx: "",
              ffmpeg: "false",
              playwright-deps: "false",
              browsers: "false",
              model: "false",
            }
    env:
      GROUP: ${{ matrix.group }}
      # `podman compose` prefers the docker-compose plugin the runner image ships, which talks to
      # a Podman socket nobody started; the gate is written for podman-compose.
      PODMAN_COMPOSE_PROVIDER: podman-compose
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # `$/` is not understood by actionlint or our pin check (see release-dry-run below).
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          bun-version: ${{ env.BUN_VERSION }}
          go-version: ${{ env.GO_VERSION }}
          pipx: ${{ matrix.pipx }}
          ffmpeg: ${{ matrix.ffmpeg }}
          playwright-deps: ${{ matrix.playwright-deps }}
          browsers: ${{ matrix.browsers }}
          model: ${{ matrix.model }}
      - name: OpenTofu
        # The static group's `tofu` step (infra/tofu/check.sh); pinned and checksummed in tools.ts.
        if: matrix.group == 'static'
        run: |
          bun scripts/release/tools.ts install --dir "$RUNNER_TEMP/bin" tofu
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify
        # Below the job's limit so a hung gate fails this step and leaves time to collect logs;
        # a job-level timeout cancels the job and diagnostics would be lost.
        timeout-minutes: ${{ matrix.step-timeout }}
        env:
          # check.sh may skip without tofu locally, never in CI.
          REQUIRE_TOFU: ${{ matrix.group == 'static' && '1' || '0' }}
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bun scripts/verify.ts --only "$GROUP" 2>&1 | tee verify.log
      - name: Summary
        if: always()
        run: bun scripts/release/ci-summary.ts verify verify.log
      - name: Collect logs
        if: failure() || cancelled()
        run: |
          mkdir -p ci-logs/podman
          podman ps -a --format '{{.Names}}' > ci-logs/podman/containers.txt || true
          while read -r name; do
            [ -n "$name" ] && podman logs --timestamps "$name" > "ci-logs/podman/$name.log" 2>&1 || true
          done < ci-logs/podman/containers.txt
          cp verify.log ci-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: verify-logs-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            harness/reports/
          retention-days: 5
          if-no-files-found: ignore

  harness:
    # The full harness scenario against the whole platform, on main, nightly and a manual dispatch
    # (to prove a branch before it reaches main); pull requests run the gate only. One job per
    # shard of `full` (FULL_SHARDS in harness/src/shards.ts), each on its own stack, so the
    # scenario takes the longest shard's time, not the sum. Parallel to the verify groups.
    name: verify (harness ${{ matrix.shard }} ${{ matrix.rep }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [rest]
        rep: [1, 2, 3, 4, 5, 6]
    env:
      PODMAN_COMPOSE_PROVIDER: podman-compose
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # `$/` is not understood by actionlint or our pin check (see release-dry-run below).
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          bun-version: ${{ env.BUN_VERSION }}
          go-version: ${{ env.GO_VERSION }}
          pipx: podman-compose==1.6.0
          ffmpeg: "true"
          playwright-deps: "true"
          browsers: "true"
          model: "true"
      - name: Verify
        # Above verify's own limits (platform up 25 + browsers 10 + scenario 45), so a hung
        # scenario is stopped by verify and still leaves its report and summary.
        timeout-minutes: 85
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bun scripts/verify.ts --full --only harness --shard "$SHARD" 2>&1 | tee verify.log
      - name: Summary
        if: always()
        run: bun scripts/release/ci-summary.ts verify verify.log
      - name: Collect logs
        if: always()
        run: |
          mkdir -p ci-logs/podman
          podman ps -a --format '{{.Names}}' > ci-logs/podman/containers.txt || true
          while read -r name; do
            [ -n "$name" ] && podman logs --timestamps "$name" > "ci-logs/podman/$name.log" 2>&1 || true
          done < ci-logs/podman/containers.txt
          cp verify.log ci-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-logs-harness-${{ matrix.shard }}-${{ matrix.rep }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            harness/reports/
          retention-days: 5
          if-no-files-found: ignore

  release-dry-run:
    name: release dry run
    if: false
    # The `$/` self-repository form is not understood by actionlint 1.7.12 or by our pin check
    # (scripts/supply-chain.ts exempts only `./`); `./` resolves to this same commit.
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
    with:
      dry_run: true
    # A called workflow can only use what its caller grants, and GitHub checks the grant
    # against every job it declares, including the ones a dry run skips (publish) or runs
    # without pushing to ghcr (publish-image). This job never runs for pull requests.
    permissions:
      contents: write
      packages: write
      id-token: write

  selfhost-e2e:
    name: self-host e2e (${{ matrix.distro }}, ${{ matrix.storage }})
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora]
        storage: [garage]
        # The external S3 store (selfhost.sh --s3-*) on Debian only, the droplets' distribution:
        # a full run of its own, in parallel, so it adds runner minutes but no wall time.
        include:
          - distro: debian
            storage: external
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Free disk space
        # 14 images plus a nested Podman store do not fit beside the preinstalled SDKs.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Unload the runner's unix-chkpwd AppArmor profile
        # Ubuntu 24.04 confines unix_chkpwd by path, also when the privileged test host execs it,
        # and denies it the capabilities Fedora needs to read its mode-000 /etc/shadow: the
        # service user's systemd manager then fails PAM. This changes the runner, not the host
        # under test.
        run: if sudo grep -q '^unix-chkpwd ' /sys/kernel/security/apparmor/profiles; then sudo apparmor_parser -R /etc/apparmor.d/unix-chkpwd; fi
      - name: End-to-end
        # Rootful podman (the runner's 4.9) can start the privileged systemd container that runs
        # Podman 5 inside; rootless podman on the runner cannot delegate the cgroups it needs.
        # Below the job's 120 so a hang still leaves time to upload .cache/selfhost-e2e.
        timeout-minutes: 105
        env:
          DISTRO: ${{ matrix.distro }}
          STORAGE: ${{ matrix.storage }}
        run: sudo --preserve-env=CI,GITHUB_ACTIONS "$(command -v bun)" scripts/selfhost/e2e.ts --distro "$DISTRO" --storage "$STORAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selfhost-e2e-${{ matrix.distro }}-${{ matrix.storage }}-${{ github.run_attempt }}
          path: .cache/selfhost-e2e/
          retention-days: 5
          if-no-files-found: ignore

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint-workflows, verify, harness, release-dry-run, selfhost-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Aggregate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bun scripts/release/ci-summary.ts needs
