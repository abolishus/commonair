name: Bug report
description: Something is broken or behaves differently than documented.
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems must not be reported here**; follow SECURITY.md instead.
        Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug. Include error messages and logs (remove any secrets).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `podman compose up`
        2. Open ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web app
        - API
        - Chat
        - IRC gateway
        - Worker
        - Origin / media
        - Relay node
        - SDK / developer platform
        - Governance / patronage
        - Harness
        - Self-hosting / infra
        - Docs
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, or the commit from the instance's "Source" footer link.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you see it
      options:
        - Local development
        - My self-hosted instance
        - The flagship instance
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Bun/Go/Podman versions, broadcasting software, as relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
