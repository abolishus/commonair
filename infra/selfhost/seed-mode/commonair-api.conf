#
# Staging seed mode only (ADR 0040): `selfhost.sh seed-mode open` copies this file to
# ~/.config/containers/systemd/commonair-api.container.d/50-seed-mode.conf and `seed-mode close`
# removes it. What the unit pins itself, so commonair.env cannot change it:
#
# - the synthetic hash lists (packages/moderation/fixtures, as harness/compose.trust-safety.yaml),
#   so the seed's T0 cases match; the instance's own lists are untouched and come back on close;
# - X-Forwarded-For trusted from the seed harness's fixed address too, so each simulated client
#   gets its own rate-limit subject (harness/src/seed/clients.ts).
[Container]
Environment=MODERATION_HASHLIST_CSAM=/fixtures/moderation/csam.pdq
Environment=MODERATION_HASHLIST_NCII=/fixtures/moderation/ncii.pdq
Environment=TRUSTED_PROXY_CIDRS=10.89.42.10/32,10.89.42.11/32,10.89.42.12/32
Volume=%h/commonair/packages/moderation/fixtures/csam.pdq:/fixtures/moderation/csam.pdq:ro,z
Volume=%h/commonair/packages/moderation/fixtures/ncii.pdq:/fixtures/moderation/ncii.pdq:ro,z
