#
# Application metrics arrive through the OpenTelemetry Collector's Prometheus
# exporter; infrastructure exposes its own endpoints. MediaMTX metrics sit behind its
# auth hook, so the media service reports stream health instead of a direct scrape.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: garage
    metrics_path: /metrics
    static_configs:
      - targets: ["garage:3903"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
