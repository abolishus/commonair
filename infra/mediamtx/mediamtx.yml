#
# MediaMTX configuration for docker.io/bluenviron/mediamtx:1.21.2-ffmpeg (alpine; busybox wget).
# Only settings that differ from the upstream defaults are listed; everything else keeps the
# MediaMTX 1.21.2 default. Secrets never live in this file: INTERNAL_API_SECRET comes from the
# container environment (MediaMTX expands $VARS in hook commands from its own environment).
#
# Ports (all >= 1024, rootless-friendly):
#   1935/tcp  RTMP ingest            8554/tcp  RTSP (TCP only; internal readers/publishers)
#   8888/tcp  LL-HLS (origin pulls)  8889/tcp  WebRTC / WHIP ingest     8189/udp  WebRTC ICE
#   9997/tcp  control API (internal) 9998/tcp  Prometheus metrics (internal)
#   8890/udp  SRT (internal)

logLevel: info
logStructured: true

readTimeout: 10s
writeTimeout: 10s

###############################################
# Authentication: every action is decided by the API (services/api, /internal/media/auth).
# MediaMTX cannot add headers to this request; the API recognizes internal callers by
# user `internal` + password INTERNAL_API_SECRET in the JSON body, and streamers by the
# stream key in the query (`?key=`) or the WHIP bearer token. Nothing is excluded: the control
# API and metrics also go through the hook, so they need the internal credentials too.
# Hosts where the API has another address override this with MTX_AUTHHTTPADDRESS.
authMethod: http
authHTTPAddress: http://api:3001/internal/media/auth
authHTTPExclude: []

###############################################
# Control API and metrics (never exposed by Caddy; reachable on the internal network only).
api: true
apiAddress: :9997
metrics: true
metricsAddress: :9998
pprof: false
playback: false

###############################################
# RTSP: TCP only. Used by services/media to read sources and publish renditions.
rtsp: true
rtspTransports: [tcp]
rtspAddress: :8554
rtspEncryption: "no"
rtspAuthMethods: [basic]

###############################################
# RTMP ingest (OBS and friends).
rtmp: true
rtmpAddress: :1935
rtmpEncryption: "no"

###############################################
# LL-HLS, pulled by services/origin. hlsAlwaysRemux is a global MediaMTX setting; it is safe to
# enable globally because only live/ paths exist (see `paths` below), so the effect is exactly
# "always remux paths under live/": the first viewer never waits for a muxer to start.
hls: true
hlsAddress: :8888
hlsEncryption: false
hlsAllowOrigins: []
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsMuxerCloseAfter: 60s

###############################################
# WebRTC: WHIP ingest. ICE over a single UDP port (>= 1024, rootless).
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []
webrtcICEServers2: []

###############################################
# SRT: internal reader path only, for the transcode ladder, the AAC copy and the recorder (ADR 0012
# variant A2). Every SRT reader of a path gets the same MPEG-TS timeline, which is what lets media
# anchor every rendition and the VOD to one clock. Never published (compose, Quadlet and
# selfhost.sh open no port for it); reads need the internal credentials like RTSP.
srt: true
srtAddress: :8890

###############################################
# Protocols we do not serve.
moq: false

###############################################
pathDefaults:
  source: publisher
  # A second publisher on the same path is refused instead of silently replacing the first;
  # a reconnecting encoder gets the path back once the old session times out.
  overridePublisher: false
  record: false

paths:
  # Channel ingest: live/<slug>. Slugs are usernames: 3-25 of [a-z0-9_].
  # The hooks tell the API the stream went online/offline; the API owns the broadcast row and
  # publishes LiveEvent on the bus, which services/media consumes. No shell is involved:
  # MediaMTX expands $VARS itself (the $MTX_* hook variables, then its own environment for
  # $INTERNAL_API_SECRET and $API_INTERNAL_URL) and only then splits the command with shell quoting rules, so the
  # variables expand even inside the single-quoted JSON. MTX_QUERY is URL-encoded, so it
  # cannot break out of the JSON string.
  "~^live/[a-z0-9_]{3,25}$":
    runOnOnline: >-
      wget -q -O- -T 10
      --header "x-internal-secret: $INTERNAL_API_SECRET"
      --header "content-type: application/json"
      --post-data '{"path":"$MTX_PATH","sourceType":"$MTX_SOURCE_TYPE","sourceId":"$MTX_SOURCE_ID","query":"$MTX_QUERY"}'
      $API_INTERNAL_URL/internal/media/ready
    runOnOnlineRestart: false
    runOnOffline: >-
      wget -q -O- -T 10
      --header "x-internal-secret: $INTERNAL_API_SECRET"
      --header "content-type: application/json"
      --post-data '{"path":"$MTX_PATH","sourceType":"$MTX_SOURCE_TYPE","sourceId":"$MTX_SOURCE_ID","query":"$MTX_QUERY"}'
      $API_INTERNAL_URL/internal/media/not-ready

  # Transcoded renditions: live/<slug>/<rendition>, and live/<slug>/aac (the source with AAC
  # audio, for WHIP/Opus ingests), published over RTSP by services/media.
  # The API auth hook allows publishing here only to the internal user.
  # useAbsoluteTimestamp: PDT comes from the publisher's RTCP sender reports, which media anchors
  # to the source's own PDT (W0, ADR 0012 A2), so a frame has one PDT on every rendition. Only
  # here: the ingest block above must never have it, or a streamer could move media time (ADR
  # 0012 decision 1: the media clock is the ingest wall clock).
  "~^live/[a-z0-9_]{3,25}/(1080p|720p|480p|audio|aac)$":
    source: publisher
    useAbsoluteTimestamp: true
