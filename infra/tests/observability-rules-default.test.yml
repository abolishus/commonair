#
# promtool rule tests, run by infra/tests/observability.test.ts: Prometheus without start.sh's
# rendered settings, so the target falls back to 0.995 (stage 0, the self-host default).
rule_files:
  - ../prometheus/rules/commonair-recording.yml
  - ../prometheus/rules/commonair-alerts.yml
# Under the 5-minute lookback, so each group sees the others' latest values (Prometheus runs at 15 s).
evaluation_interval: 4m

tests:
  # 2% of requests fail: 3.9 times the 0.995 budget, under both burn lines, so nothing pages.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="api",http_response_status_code="200"}'
        values: "0+600x200"
      - series: 'http_server_request_duration_seconds_count{service_name="api",http_response_status_code="500"}'
        values: "0+12x200"
    promql_expr_test:
      - expr: commonair:slo_target
        eval_time: 10m
        exp_samples:
          - labels: 'commonair:slo_target{slo_target="0.995"}'
            value: 0.995
    alert_rule_test:
      - eval_time: 100m
        alertname: CommonairSloBurnFast
        exp_alerts: []
      - eval_time: 100m
        alertname: CommonairSloBurnSlow
        exp_alerts: []

  # Eight days of load, sampled every 2 minutes on a 4-core host:
  # Postgres 0.45 (over 0.4: fires), host CPU 0.5 (over 0.48: fires), transcode 0.55 (under 0.56:
  # quiet), and one restore drill of 12000 s (over 11520: fires).
  - interval: 2m
    input_series:
      - series: "system_cpu_logical_count"
        values: "4x5765"
      - series: 'system_cpu_time_seconds_total{cpu="cpu0",state="user"}'
        values: "0+60x5765"
      - series: 'system_cpu_time_seconds_total{cpu="cpu0",state="idle"}'
        values: "0+60x5765"
      - series: 'commonair_postgres_active_time_seconds_total{state_mode="bundled"}'
        values: "0+216x5765"
      - series: "media_transcode_cpu_time_seconds_total"
        values: "0+264x5765"
      - series: "commonair_restore_drill_seconds"
        values: "_x5700 12000x3"
    alert_rule_test:
      - eval_time: 8d12m
        alertname: CommonairStage0PostgresCpu
        exp_alerts:
          - exp_labels:
              severity: ticket
              summary: Postgres load has peaked over 40% of the host every day for 7 days (stage 0 trigger at 50%)
              runbook: docs/operators/monitoring.md#commonairstage0postgrescpu
      - eval_time: 8d12m
        alertname: CommonairStage1AppCpu
        exp_alerts:
          - exp_labels:
              severity: ticket
              summary: App host CPU has peaked over 48% every day for 7 days (stage 1 trigger at 60%)
              runbook: docs/operators/monitoring.md#commonairstage1appcpu
      - eval_time: 8d12m
        alertname: CommonairStage2TranscodeCpu
        exp_alerts: []
      - eval_time: 8d12m
        alertname: CommonairStage0RestoreTime
        exp_alerts:
          - exp_labels:
              severity: ticket
              summary: The last restore drill took over 3.2 h (stage 0 trigger at 4 h)
              runbook: docs/operators/monitoring.md#commonairstage0restoretime
      # Six days in, the week is not complete yet: nothing is sustained.
      - eval_time: 6d
        alertname: CommonairStage1AppCpu
        exp_alerts: []

  # The collector is up but reads neither Postgres nor Valkey: Postgres counts its failed scrapes,
  # and both sets of series are gone.
  - interval: 1m
    input_series:
      - series: 'up{job="otel-collector",instance="otel-collector:9464"}'
        values: "1x30"
      - series: 'otelcol_scraper_errored_metric_points{receiver="postgresql",scraper="postgresql"}'
        values: "0+20x30"
    alert_rule_test:
      - eval_time: 16m
        alertname: CommonairStateScrapeFailing
        exp_alerts:
          - exp_labels:
              receiver: postgresql
              severity: ticket
              summary: The collector cannot read Postgres or Valkey metrics
              runbook: docs/operators/monitoring.md#commonairstatescrapefailing
          - exp_labels:
              receiver: redis
              severity: ticket
              summary: The collector cannot read Postgres or Valkey metrics
              runbook: docs/operators/monitoring.md#commonairstatescrapefailing

  # Both answer: quiet.
  - interval: 1m
    input_series:
      - series: 'up{job="otel-collector",instance="otel-collector:9464"}'
        values: "1x30"
      - series: 'otelcol_scraper_errored_metric_points{receiver="postgresql",scraper="postgresql"}'
        values: "0x30"
      - series: 'postgresql_backends{postgresql_database_name="commonair",state_mode="external"}'
        values: "3x30"
      - series: 'redis_uptime_seconds_total{state_mode="external"}'
        values: "0+60x30"
    alert_rule_test:
      - eval_time: 16m
        alertname: CommonairStateScrapeFailing
        exp_alerts: []

  # Restore drills, one sample per push (the collector keeps a gauge five minutes; at 1 h
  # sampling each push is one sample). The dump drill succeeds at 0 h and fails at 168 h; the
  # WAL-G drill succeeds at 0 h and never runs again.
  - interval: 1h
    input_series:
      - series: 'commonair_restore_drill_success{kind="dump",service_name="commonair-selfhost"}'
        values: "1 _x167 0"
      - series: 'commonair_restore_drill_success{kind="walg",service_name="commonair-selfhost"}'
        values: "1"
    alert_rule_test:
      # A week in: both last reported a success.
      - eval_time: 167h
        alertname: CommonairRestoreDrillFailed
        exp_alerts: []
      - eval_time: 167h
        alertname: CommonairRestoreDrillOverdue
        exp_alerts: []
      # The dump drill's latest result is a failure.
      - eval_time: 169h
        alertname: CommonairRestoreDrillFailed
        exp_alerts:
          - exp_labels:
              kind: dump
              severity: ticket
              summary: The last restore drill failed, so the newest backup is not known to restore
              runbook: docs/operators/monitoring.md#commonairrestoredrillfailed
      # Past 8 days and the 1 h hold: WAL-G has reported nothing (overdue); the dump drill's
      # failure is still in the window, so it is failed, not overdue.
      - eval_time: 194h
        alertname: CommonairRestoreDrillOverdue
        exp_alerts:
          - exp_labels:
              kind: walg
              severity: ticket
              summary: No restore drill has reported within its window (8 days)
              runbook: docs/operators/monitoring.md#commonairrestoredrilloverdue
      - eval_time: 194h
        alertname: CommonairRestoreDrillFailed
        exp_alerts:
          - exp_labels:
              kind: dump
              severity: ticket
              summary: The last restore drill failed, so the newest backup is not known to restore
              runbook: docs/operators/monitoring.md#commonairrestoredrillfailed
      # 8 days after the failure with no run since: overdue now, no longer failed.
      - eval_time: 362h
        alertname: CommonairRestoreDrillFailed
        exp_alerts: []
      - eval_time: 362h
        alertname: CommonairRestoreDrillOverdue
        exp_alerts:
          - exp_labels:
              kind: dump
              severity: ticket
              summary: No restore drill has reported within its window (8 days)
              runbook: docs/operators/monitoring.md#commonairrestoredrilloverdue
          - exp_labels:
              kind: walg
              severity: ticket
              summary: No restore drill has reported within its window (8 days)
              runbook: docs/operators/monitoring.md#commonairrestoredrilloverdue

  # Weekly successes, a failure, then a success again: quiet once the success lands.
  - interval: 1h
    input_series:
      - series: 'commonair_restore_drill_success{kind="walg"}'
        values: "1 _x167 1 _x167 0 _x5 1"
    alert_rule_test:
      - eval_time: 340h
        alertname: CommonairRestoreDrillFailed
        exp_alerts:
          - exp_labels:
              kind: walg
              severity: ticket
              summary: The last restore drill failed, so the newest backup is not known to restore
              runbook: docs/operators/monitoring.md#commonairrestoredrillfailed
      - eval_time: 345h
        alertname: CommonairRestoreDrillFailed
        exp_alerts: []
      - eval_time: 345h
        alertname: CommonairRestoreDrillOverdue
        exp_alerts: []

  # No drill ever reported. Quiet while Prometheus is younger than 15 days (a new install, whose
  # first drill is up to a week away), then kind="none". Prometheus scrapes its own metrics, so
  # this series is continuous (sampled within the 5-minute lookback).
  - interval: 4m
    input_series:
      - series: 'prometheus_tsdb_lowest_timestamp_seconds{job="prometheus",instance="127.0.0.1:9090"}'
        values: "0x6000"
    alert_rule_test:
      - eval_time: 14d
        alertname: CommonairRestoreDrillOverdue
        exp_alerts: []
      - eval_time: 16d
        alertname: CommonairRestoreDrillOverdue
        exp_alerts:
          - exp_labels:
              kind: none
              severity: ticket
              summary: No restore drill has reported within its window (8 days)
              runbook: docs/operators/monitoring.md#commonairrestoredrilloverdue

  # The status page's metrics.txt: rendered every minute (the gauge is the test's own time), then
  # the renderer stops at 30 min. Older than 5 minutes from 35 min, firing after 10 more.
  - interval: 1m
    input_series:
      - series: 'commonair_status_page_updated_timestamp_seconds{job="status-page",instance="status.example.org"}'
        values: "0+60x30 1800x40"
      - series: 'up{job="status-page",instance="status.example.org"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 30m
        alertname: CommonairStatusPageStale
        exp_alerts: []
      - eval_time: 40m
        alertname: CommonairStatusPageStale
        exp_alerts: []
      - eval_time: 48m
        alertname: CommonairStatusPageStale
        exp_alerts:
          - exp_labels:
              job: status-page
              severity: ticket
              summary: The status page is out of date or cannot be read, so outside alerts may not be sent
              runbook: docs/operators/monitoring.md#commonairstatuspagestale

  # The monitoring droplet is gone from 11 min: the scrape fails and the gauge goes stale.
  - interval: 1m
    input_series:
      - series: 'commonair_status_page_updated_timestamp_seconds{job="status-page",instance="status.example.org"}'
        values: "0+60x10"
      - series: 'up{job="status-page",instance="status.example.org"}'
        values: "1x10 0x30"
    alert_rule_test:
      - eval_time: 16m
        alertname: CommonairStatusPageStale
        exp_alerts: []
      - eval_time: 24m
        alertname: CommonairStatusPageStale
        exp_alerts:
          - exp_labels:
              job: status-page
              severity: ticket
              summary: The status page is out of date or cannot be read, so outside alerts may not be sent
              runbook: docs/operators/monitoring.md#commonairstatuspagestale

  # A page rendered every minute: quiet.
  - interval: 1m
    input_series:
      - series: 'commonair_status_page_updated_timestamp_seconds{job="status-page",instance="status.example.org"}'
        values: "0+60x60"
      - series: 'up{job="status-page",instance="status.example.org"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 58m
        alertname: CommonairStatusPageStale
        exp_alerts: []
