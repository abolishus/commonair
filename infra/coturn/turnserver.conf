#
# coturn: the instance's own STUN server for P2P playback, and its optional TURN relay
# (ADR 0005 amendment 1, decision 2; docs/self-hosting/p2p.md). This is the part that never
# depends on the environment. infra/coturn/start.sh copies it at every start and appends the
# rest from the environment (port, realm, external address, relay on or off, the secret), so no
# secret is in the image or in git.

# Ask for and send FINGERPRINT attributes (RFC 5389); browsers send them.
fingerprint
# Short-lived nonces: a captured nonce is useless after 600 s.
stale-nonce=600

# UDP only. No TCP or TLS listener: browsers reach STUN and TURN over UDP, and TURN over TLS
# (turns:) needs a certificate this unit does not have yet (infra/coturn/README.md, "TURNS").
# TLS 1.0 and 1.1 stay off: coturn 4.18 enables them only with `tlsv1`/`tlsv1_1`, which this
# file never sets (it has no `no-tlsv1` options any more), and DTLS starts only with `dtls`.
no-tcp
no-tls
# The relay, when on, relays UDP only.
no-tcp-relay

# No telnet CLI (it is off by default in 4.18; this keeps it off if a default changes).
no-cli
# Never relay to broadcast and multicast peers (224.0.0.0/4, ff00::/8).
no-multicast-peers

# No log at all, so no client address, TURN username or peer address reaches the journal or Loki
# (coturn logs every session with them at its default level). To debug, run turnserver in the
# foreground with --log-file=stdout (infra/coturn/README.md, "Debugging").
no-stdout-log
simple-log
log-file=/dev/null
# The image runs as nobody, which cannot write coturn's default pid file.
pidfile=/tmp/turnserver.pid

# Never relay into private, loopback, link-local, CGNAT, documentation, benchmarking, reserved or
# transition ranges. With host networking the relay would otherwise reach Valkey, Postgres,
# Garage (127.0.0.1:3900), Grafana (127.0.0.1:3030) and the cloud metadata service. The same list
# as the API's outbound-URL check, IPv4-mapped forms included.
